<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STORM-2 Unified Casualty Record</title>
<style>
:root{--navy:#1C2B3A;--blue:#2E5A8A;--bg:#F3F5F8;--card:#fff;--line:#D5DCE4;--mut:#5B6B7C;--on:#2E5A8A;--onbg:#E3ECF6;--red:#B3261E;--amber:#9A6700;--green:#1E6B3A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--navy);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header{background:var(--navy);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header .ttl{font-weight:700;font-size:15px;letter-spacing:.3px}
header .ttl small{display:block;font-weight:400;opacity:.75;font-size:11px}
.pt{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;flex:1;min-width:280px}
.pt b{font-size:17px}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;background:#33475B}
.tag.red{background:var(--red)}.tag.amb{background:#C98A00;color:#111}.tag.grn{background:var(--green)}.tag.blk{background:#000}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hb{background:#2E3F51;color:#fff;border:1px solid #4A5E73;border-radius:6px;padding:9px 12px;font-size:14px;min-height:42px;cursor:pointer}
.hb.on{background:#fff;color:var(--navy)}
.roleSel{display:flex;gap:4px;align-items:center;font-size:12px}
.roleSel .hb{padding:9px 11px}
main{display:grid;grid-template-columns:1fr;min-height:0}
#app.vpo main{grid-template-columns:1fr 390px}
nav{background:#E6EBF1;border-bottom:2px solid var(--blue);display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
nav button{display:flex;align-items:center;flex:1 1 auto;justify-content:space-between;border:1px solid #C3CFDB;background:#fff;padding:8px 11px;border-radius:6px;font-size:13px;color:var(--navy);min-height:44px;cursor:pointer;gap:6px;white-space:nowrap}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
nav button .n{font-size:10px;background:var(--onbg);color:var(--blue);border-radius:10px;padding:2px 6px;font-weight:700}
nav button.on .n{background:var(--blue);color:#fff}
#content{overflow-y:auto;padding:6px 18px 50vh;scroll-behavior:auto;position:relative}
.sec{padding-top:14px;border-top:3px solid var(--navy);margin-top:18px}
.sec:first-child{border-top:0;margin-top:0}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.totop{position:fixed;right:18px;bottom:18px;z-index:12;border:0;background:var(--navy);color:#fff;border-radius:24px;padding:12px 16px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
#app.vpo .totop{right:408px}
#vp{background:#fff;border-left:1px solid var(--line);overflow-y:auto;display:none}
#app.vpo #vp{display:block}
.vph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:2}
.vpc{padding:10px 12px;border-bottom:1px solid var(--line)}
.vclock{font-size:30px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.vrec{width:100%;margin-top:10px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:18px;font-weight:700;min-height:56px;cursor:pointer}
.vrec.live{background:var(--navy);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.6)}50%{box-shadow:0 0 0 8px rgba(179,38,30,0)}}
.vlive{min-height:40px;margin:8px 0;padding:8px;background:#F6F8FB;border-radius:6px;font-style:italic;color:var(--mut)}
.vph2{padding:8px 12px;border-bottom:1px solid var(--line)}
.vt{font-variant-numeric:tabular-nums}
.rl2{font-size:11px;background:var(--onbg);color:var(--blue);border-radius:4px;padding:1px 6px;margin-left:6px}
.vtx{margin:3px 0 5px;font-size:14px}
.vop{display:inline-flex;align-items:center;gap:4px;background:#E7F1EA;border:1px solid #9CC3A8;color:#1E4D2B;border-radius:5px;padding:3px 4px 3px 7px;font-size:12px;margin:0 4px 4px 0}
.vop button{border:0;background:#fff;border-radius:4px;cursor:pointer;font-size:14px;min-width:30px;min-height:28px}
.hb.rec{background:var(--red);border-color:var(--red);font-weight:700}
.hb.rec.live{animation:pulse 1.4s infinite}
.act:disabled{opacity:.45}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hb{min-height:44px}
.mic{min-height:40px;padding:8px 12px;font-size:13px}
.act.del{min-height:44px;min-width:44px}
.vop button{min-width:40px;min-height:36px}
.efdel{min-height:34px;min-width:40px}
nav .sh{display:none}
input.bad{border-color:var(--red);background:#FDECEA}
.tqg{display:grid;gap:8px}
.tqc{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#FBFCFD}
.tqc.live{border-color:var(--red);background:#FFF6F5}
.tqh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tqh b{min-width:100px}.tqh input{flex:1;max-width:340px;min-height:40px;padding:6px 8px;font-size:15px}
.tqt4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;background:#1C2B3A;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.3)}
#kp.show{display:block}
.kpb{max-width:620px;margin:0 auto}
.kph{display:flex;justify-content:space-between;align-items:baseline;color:#fff;padding:2px 4px 8px;gap:10px}
.kpl{font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.kpr{display:flex;gap:6px;margin-bottom:6px}
.kpr button{flex:1;min-height:44px;border:0;border-radius:6px;background:#2E5A8A;color:#fff;font-size:15px;font-weight:700}
.kpg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpg button{min-height:54px;border:0;border-radius:6px;background:#fff;color:#1C2B3A;font-size:22px;font-weight:700}
.kpg button.kpn{background:#C9D6E3;font-size:15px}
.kpg button.kpd{background:#1E6B3A;color:#fff;font-size:17px}
#app.kpo #content{padding-bottom:420px}
@media (max-width:1100px){
 header .ttl{display:none}
 nav .lg{display:none}nav .sh{display:inline}
 nav button{padding:8px 9px}
 #app.vpo main{grid-template-columns:1fr;grid-template-rows:1fr 36vh}
 #app.vpo #vp{border-left:0;border-top:3px solid var(--navy)}
 #app.vpo .totop{right:18px;bottom:calc(36vh + 14px)}
 .card table:not(.efs){display:block;overflow-x:auto;white-space:nowrap}
 #content{padding-left:10px;padding-right:10px}
}
.agebtn{width:100%;min-height:44px;font-size:16px;text-align:left;padding:10px;border:1px solid #AFC0D2;border-radius:6px;background:#fff;color:var(--mut);cursor:pointer;display:flex;justify-content:space-between}
.agebtn.set{color:var(--navy);font-weight:700}
.fld{position:relative}
.agelist{position:absolute;left:0;right:0;z-index:8;margin-top:4px;border:1px solid var(--blue);border-radius:6px;height:264px;overflow-y:auto;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);-webkit-overflow-scrolling:touch}
.ageopt{display:block;width:100%;border:0;border-bottom:1px solid #EEF1F5;background:#fff;text-align:left;padding:0 14px;min-height:44px;font-size:17px;color:var(--navy);cursor:pointer}
.ageopt.on{background:var(--blue);color:#fff;font-weight:700}
.efw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.efs{width:auto;border-collapse:separate;border-spacing:0}
.efs th,.efs td{min-width:168px;vertical-align:middle;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.efs .efz{position:sticky;left:0;z-index:1;min-width:150px;background:#fff;font-weight:700;font-size:13px}
.efs th.efz{background:var(--navy);color:#fff}
.efs tr:nth-child(even) td.efz{background:#F6F8FB}
.efs th input{margin-top:4px;min-height:38px;font-size:14px;padding:5px}
.efs td input{min-height:38px;font-size:14px;padding:5px}
.efh{display:flex;align-items:center;gap:6px}
.efdel{margin-left:auto;border:1px solid #fff;background:transparent;color:#fff;border-radius:4px;font-size:12px;padding:3px 7px;cursor:pointer}
.efc{display:flex;gap:4px}.efc .chip{padding:6px 8px;min-width:44px;font-size:13px}
.chip.efp.on{background:var(--red);border-color:var(--red)}
.chip.efn.on{background:var(--green);border-color:var(--green)}
.chip.efq.on{background:#C98A00;border-color:#C98A00;color:#111}
.vchart{display:flex;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.vcl{flex:0 0 104px;background:#fff;border-right:1px solid var(--line)}
.vcs{overflow-x:auto;flex:1}
.vcs svg [data-tip]{cursor:pointer}
.vleg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;margin-bottom:8px}
.vleg span{display:inline-flex;align-items:center;gap:5px}
h2{margin:2px 0 2px;font-size:21px}
.srcl{color:var(--blue);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px}
.fld{min-width:0}
.fld.w2{grid-column:span 2}.fld.full{grid-column:1/-1}
.lab{font-size:12px;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #AFC0D2;background:#fff;color:var(--navy);border-radius:6px;padding:9px 12px;font-size:14px;min-height:44px;min-width:44px;cursor:pointer;position:relative;line-height:1.15}
.chip.on{background:var(--on);border-color:var(--on);color:#fff;font-weight:700}
.chip .st{display:block;font-size:10px;font-weight:400;opacity:.9;margin-top:2px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #AFC0D2;border-radius:6px;background:#fff;color:var(--navy);min-height:44px}
textarea{min-height:84px;resize:vertical}
.tw{display:flex;gap:6px}.tw input{flex:1}
.now{border:1px solid var(--blue);background:var(--onbg);color:var(--blue);border-radius:6px;padding:0 10px;font-size:13px;font-weight:700;min-height:44px;cursor:pointer;white-space:nowrap}
.mic{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.mic.live{background:var(--red);border-color:var(--red);color:#fff}
.unit{font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:#fff;font-weight:700;text-align:left;padding:7px 8px;font-size:12px}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:#F6F8FB}
.tqt td,.tqt th{padding:5px}
.tqt input{min-height:40px;padding:6px;font-size:15px}
.act{border:0;background:var(--blue);color:#fff;border-radius:6px;padding:11px 16px;font-size:15px;font-weight:700;min-height:46px;cursor:pointer}
.act.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.act.del{background:#fff;color:var(--red);border:1px solid var(--red);padding:6px 10px;min-height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.qp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qp .chip{font-size:13px;padding:8px 10px}
.vin{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:8px}
.vin label{font-size:11px;color:var(--mut)}
.body{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.body svg{background:#F6F8FB;border:1px solid var(--line);border-radius:8px;touch-action:manipulation;cursor:crosshair}
.mk{font-size:11px;font-weight:700}
.efast td{text-align:center}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 46px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl .tm{font-weight:700}
.tl .rl{font-size:11px;background:var(--onbg);color:var(--blue);border-radius:4px;text-align:center;padding:2px 0;height:fit-content}
.gap{background:#FFF7E0;border:1px solid #E5C76B;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px}
canvas.sigc{border:1px dashed #8AA0B6;border-radius:6px;background:#fff;touch-action:none;width:100%;max-width:520px;height:150px}
.modal{position:fixed;inset:0;background:rgba(15,25,35,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:20}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:10px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.plist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:12px;margin-bottom:6px;font-size:15px;cursor:pointer;min-height:52px;gap:10px}
.plist button.cur{border-color:var(--blue);background:var(--onbg)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;display:none;z-index:30}
.foot{font-size:11px;color:var(--mut);margin-top:24px}
.hide{display:none!important}
.timers{display:flex;gap:6px;flex-wrap:wrap}
.timers .tag{font-weight:400}
@media (max-width:700px){.fld.w2{grid-column:auto}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="ttl" id="hTitle"></div>
  <div class="pt" id="ptBanner"></div>
  <div class="roleSel" id="roleSel"></div>
  <div class="hbtns">
    <button class="hb rec" id="bVoice" data-voice="1"></button>
    <button class="hb" id="bPanel" data-vptoggle="1"></button>
    <button class="hb" id="bList"></button>
    <button class="hb" id="bNew"></button>
    <button class="hb" id="bLang">EN</button>
    <button class="hb" id="bKp" title="Keypad">⌨</button>
    <button class="hb" id="bFs" title="Full screen">⛶</button>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="content"></div>
  <aside id="vp"></aside>
</main>
<div id="kp"></div>
<button class="totop" id="toTop">▲ <span id="toTopL"></span></button>
</div>
<div class="modal" id="mList"><div class="mbox" id="mListBox"></div></div>
<div id="toast"></div>
<script>
(function(){
"use strict";
/* ---------- language ---------- */
var L='ua';
function T(en,ua){return L==='ua'?(ua||en):en;}
function O(v,en,ua){return [v,en,ua];}
var YN=[O('y','Yes','Так'),O('n','No','Ні')];
var YNU=[O('y','Yes','Так'),O('n','No','Ні'),O('u','Unknown','Невідомо')];
var LR=[O('R','Right','Справа'),O('L','Left','Зліва')];
var LIMBS=[O('RUE','R arm','П рука'),O('LUE','L arm','Л рука'),O('RLE','R leg','П нога'),O('LLE','L leg','Л нога')];
var ROLES=['1','2','3','4'];

/* ---------- schema ----------
 field: {k,t,en,ua,o:opts,u:unit,w:'w2'|'full',stamp:true}
 t: chips | multi | text | num | date | time | area | w (widget)
*/
function DEP(n){return [
  {k:'depDate'+n,t:'date',en:'Departure date',ua:'Дата вибуття'},{k:'depTime'+n,t:'time',en:'Departure time',ua:'Час вибуття'},
  {k:'evTo'+n,t:'chips',en:'Evacuated to: role',ua:'Евакуйований до: рівень',o:[O('1','Role 1','Рівень 1'),O('2','Role 2','Рівень 2'),O('3','Role 3','Рівень 3'),O('4','Role 4','Рівень 4')],w:'w2'},
  {k:'evFac'+n,t:'text',en:'Evacuated to: facility',ua:'Евакуйований до: заклад',w:'w2'},
  {k:'depCat'+n,t:'chips',en:'Evacuation category',ua:'Евакуаційна категорія',o:[O('1','I'),O('2','II'),O('3','III')]},
  {k:'depPos'+n,t:'chips',en:'Position',ua:'Положення',o:[O('si','Sitting','Сидячи'),O('ly','Lying','Лежачи')]},
  {k:'escort'+n,t:'chips',en:'Escort',ua:'Супровід',o:YN},
  {k:'trans'+n,t:'chips',en:'Transport',ua:'Транспорт',o:[O('casevac','CASEVAC'),O('mmrm','MMRM (ММРМ)','ММРМ'),O('medevac','MEDEVAC')],w:'w2'},
  {k:'vehT'+n,t:'chips',en:'Vehicle type (Б/С, М/С) [confirm]',ua:'Тип (Б/С, М/С)',o:[O('bs','Б/С'),O('ms','М/С')]},
  {k:'depAdd'+n,t:'multi',en:'Additional',ua:'Додатково',o:[O('A','A'),O('B','B'),O('cons','CONS'),O('o2','Oxygen','Кисень'),O('vent','Ventilator','ШВЛ'),O('oth','Other','Інше')],w:'full'}];}
function PROV(n){return [
  {k:'prov'+n,t:'text',en:'Provider full name',ua:'ПІБ медичного працівника',w:'w2'},
  {k:'provUnit'+n,t:'text',en:'Medical unit',ua:'Медичний підрозділ'},
  {k:'provRole'+n,t:'chips',en:'Role',ua:'Рівень',o:[O('1','1'),O('2','2'),O('3','3'),O('4','4')]},
  {k:'provDate'+n,t:'date',en:'Date',ua:'Дата'},
  {k:'sig'+n,t:'w',w:'full'}];}
var S=[
{id:'pt',en:'Patient',ua:'Пацієнт',src:'001/о [1]; 002/о (1); 003-3/о header',g:[
 {en:'Identification',ua:'Ідентифікація',f:[
  {k:'cardNo',t:'text',en:'Card No.',ua:'Картка №'},
  {k:'name',t:'text',en:'Full name (last, first, patronymic)',ua:'ПІБ (прізвище, ім’я, по батькові)',w:'w2'},
  {k:'rank',t:'text',en:'Rank',ua:'Військове звання'},
  {k:'unit',t:'text',en:'Unit',ua:'Військова частина / підрозділ'},
  {k:'pid',t:'text',en:'ID number',ua:'Ідентифікаційний номер'},
  {k:'dob',t:'date',en:'Date of birth',ua:'Дата народження',noToday:1},
  {k:'age',t:'age',en:'Approximate age',ua:'Орієнтовний вік',u:'yrs'},
  {k:'sex',t:'chips',en:'Sex',ua:'Стать',o:[O('M','M','Ч'),O('F','F','Ж')]},
  {k:'wt',t:'num',en:'Weight',ua:'Маса тіла',u:'kg'},
  {k:'ht',t:'num',en:'Height',ua:'Зріст',u:'cm'},
  {k:'ibw',t:'num',en:'Ideal body weight',ua:'Ідеальна маса тіла',u:'kg',ibw:1},
  {k:'pcat',t:'chips',en:'Category (Ц/В/П) [confirm]',ua:'Категорія (Ц/В/П)',o:[O('V','Military (В)','Військовий (В)'),O('C','Civilian (Ц)','Цивільний (Ц)'),O('P','POW (П)','Полонений (П)')]},
  {k:'inpatNo',t:'text',en:'Inpatient record No. (003-3/о)',ua:'Медична карта стаціонарного хворого №'}
 ]},
 {en:'Allergy and blood',ua:'Алергія та кров',f:[
  {k:'allergy',t:'chips',en:'Allergy',ua:'Алергія',o:YNU},
  {k:'allergyTxt',t:'text',en:'Allergy details',ua:'Деталі алергії',w:'w2'},
  {k:'abo',t:'chips',en:'Blood group ABO',ua:'Група крові',o:[O('O','O (I)','0 (I)'),O('A','A (II)','A (II)'),O('B','B (III)','B (III)'),O('AB','AB (IV)','AB (IV)'),O('nd','Not determined','Не визначено')]},
  {k:'rh',t:'chips',en:'Rh',ua:'Резус',o:[O('+','Rh +','Rh +'),O('-','Rh −','Rh −')]}
 ]},
 {en:'Event and triage',ua:'Подія та сортування',f:[

 if((x=num(s,'pain score|pain is|pain|біль',10))&&(x=rng(x,0,10))!=null)v.pain=x;

 if((x=num(s,'blood loss|ebl|крововтрат'))&&(x=rng(x,0,20000))!=null)v.ebl=x;
 if(has(s,'unresponsive|not responding|не реагує|без свідомості'))v.avpu='U';
 else if(has(s,'responds to pain|responsive to pain|реагує на біль'))v.avpu='P';

 for(var s=t0;s<=t1;s+=300){var x=X(s),maj=s%900===0;g+='<line x1="'+x+'" x2="'+x+'" y1="'+TOP+'" y2="'+(H-4)+'" stroke="'+(maj?'#AFC0D2':'#E6EBF1')+'"/>';
  if(maj){var hh=Math.floor(s/3600)%24,mm=Math.floor(s%3600/60);g+='<text x="'+x+'" y="'+(TOP+PH+16)+'" text-anchor="'+(x<30?'start':'middle')+'" font-size="11" fill="#1C2B3A" font-weight="700">'+pad(hh)+':'+pad(mm)+'</text>';}}
 ROWS.forEach(function(rw,i){var y=RY0+i*RH;g+='<rect x="0" y="'+y+'" width="'+W+'" height="'+RH+'" fill="'+(i%2?'#F6F8FB':'#fff')+'" stroke="#E6EBF1"/>';});
 var vs=pts.filter(function(p){return p.k==='v';});
 /* pulse line */
 var hp=vs.filter(function(p){return p.o.hr;}).map(function(p){return X(p.s).toFixed(1)+','+Y(+p.o.hr).toFixed(1);});
 if(hp.length>1)g+='<polyline points="'+hp.join(' ')+'" fill="none" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="4 3"/>';
 vs.forEach(function(p){var o=p.o,x=X(p.s),tip=p.o.time+'  '+vdesc(o);
  if(o.sbp&&o.dbp)g+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(+o.sbp)+'" y2="'+Y(+o.dbp)+'" stroke="#1C2B3A" stroke-width="2"/>';
  if(o.sbp)g+='<path d="M'+(x-6)+','+(Y(+o.sbp)-7)+' L'+x+','+Y(+o.sbp)+' L'+(x+6)+','+(Y(+o.sbp)-7)+'" fill="none" stroke="#1C2B3A" stroke-width="2.5"/>';
  if(o.dbp)g+='<path d="M'+(x-6)+','+(Y(+o.dbp)+7)+' L'+x+','+Y(+o.dbp)+' L'+(x+6)+','+(Y(+o.dbp)+7)+'" fill="none" stroke="#1C2B3A" stroke-width="2.5"/>';
  if(o.hr)g+='<circle cx="'+x+'" cy="'+Y(+o.hr)+'" r="4.5" fill="#B3261E"/>';
  g+='<rect data-tip="'+esc(tip)+'" x="'+(x-9)+'" y="'+TOP+'" width="18" height="'+PH+'" fill="transparent"/>';
  [['spo2',0],['rr',1],['etco2',5],['temp',6],['urine',7],['ebl',8]].forEach(function(c){if(o[c[0]]!=null&&o[c[0]]!=='')g+=cell(x,RY0+c[1]*RH,o[c[0]],c[0]==='spo2'&&+o.spo2<90);});
  if(o.signs&&o.signs.length)g+=cell(x,RY0+9*RH,o.signs.join(' '));});
 pts.filter(function(p){return p.k==='w';}).forEach(function(p){var o=p.o,x=X(p.s);
  var t=[o.fio2,o.peep].filter(function(z){return z!=null&&z!=='';}).join('/');if(t)g+=cell(x,RY0+2*RH,t);if(o.o2)g+=cell(x,RY0+3*RH,o.o2);if(o.inh)g+=cell(x,RY0+4*RH,o.inh);if(o.etco2)g+=cell(x,RY0+5*RH,o.etco2);
  if(o.rr)g+=cell(x,RY0+RH,'//'+o.rr);});
 var lane=0;pts.filter(function(p){return p.k==='m';}).forEach(function(p){var o=p.o,x=X(p.s),y=RY0+10*RH;lane=1-lane;
  var lbl=(o.name||'').slice(0,4)+(o.dose?' '+o.dose:'');g+='<g data-tip="'+esc(o.time+'  '+[o.name,o.dose,o.route].filter(Boolean).join(' '))+'"><line x1="'+x+'" x2="'+x+'" y1="'+y+'" y2="'+(y+RH)+'" stroke="#2E5A8A" stroke-width="2"/><text x="'+(x+3)+'" y="'+(y+(lane?11:22))+'" font-size="10" fill="#2E5A8A">'+esc(lbl)+'</text></g>';});
 pts.filter(function(p){return p.k==='e';}).forEach(function(p){var x=X(p.s),y=RY0+11*RH+13;g+='<g data-tip="'+esc(hms2(p.s)+'  '+p.o.txt)+'"><path d="M'+x+','+(y-7)+' L'+(x+7)+','+y+' L'+x+','+(y+7)+' L'+(x-7)+','+y+' Z" fill="#2E5A8A"/></g>';});
 g+='</svg>';
 var leg='<div class="vleg"><span><svg width="16" height="12"><path d="M2,2 L8,10 L14,2" fill="none" stroke="#1C2B3A" stroke-width="2.5"/></svg> '+esc(T('Systolic','Систолічний АТ'))+'</span><span><svg width="16" height="12"><path d="M2,10 L8,2 L14,10" fill="none" stroke="#1C2B3A" stroke-width="2.5"/></svg> '+esc(T('Diastolic','Діастолічний АТ'))+'</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#B3261E"/></svg> '+esc(T('Pulse','Пульс'))+'</span><span><svg width="14" height="14"><path d="M7,1 L13,7 L7,13 L1,7 Z" fill="#2E5A8A"/></svg> '+esc(T('Event','Подія'))+'</span><span>// '+esc(T('ventilated','ШВЛ'))+'</span><span class="unit">'+esc(T('Tap a mark for details. Scroll sideways for earlier times.','Торкніться позначки для деталей. Прокрутіть убік для раніших записів.'))+'</span></div>';
 return leg+'<div class="vchart">'+L+'<div class="vcs">'+g+'</div></div>';}
function cell(x,y,v,warn){return '<text x="'+x+'" y="'+(y+17)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(warn?'#B3261E':'#1C2B3A')+'">'+esc(v)+'</text>';}
function hms2(s){s=s%86400;return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function chartsToEnd(){document.querySelectorAll('.vcs').forEach(function(d){d.scrollLeft=d.scrollWidth;});}

/* ---------- export ---------- */
function flat(r){var o={id:r.id,role:r.role,updated:r.updated};Object.keys(r.f).forEach(function(k){var v=r.f[k];o[k]=Array.isArray(v)?v.join(';'):v;});
 Object.keys(r.tq).forEach(function(k){Object.keys(r.tq[k]).forEach(function(c){o['tq_'+k+'_'+c]=r.tq[k][c];});});
 efSorted().forEach(function(e,i){o['efast'+(i+1)+'_time']=e.time;EFZ.forEach(function(z){o['efast'+(i+1)+'_'+z[0]]=e.z[z[0]]||'';});});
 o.meds=r.meds.map(function(m){return m.time+' '+m.name+' '+m.dose+' '+m.route;}).join(' | ');
 o.vitals=r.vitals.map(function(v){return v.time+' HR'+(v.hr||'')+' BP'+(v.sbp||'')+'/'+(v.dbp||'')+' SpO2 '+(v.spo2||'');}).join(' | ');
 o.transcript=(r.voice||[]).map(function(p){return p.t+' '+p.text;}).join(' | ');
 o.injuries=r.body.map(function(m){return m.side+':'+m.type+'@'+m.x+','+m.y;}).join(' ');return o;}
function csv(){var rows=Object.keys(recs).map(function(k){return flat(recs[k]);}),cols=[];rows.forEach(function(r){Object.keys(r).forEach(function(c){if(cols.indexOf(c)<0)cols.push(c);});});
 function q(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
 return [cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){return q(r[c]);}).join(',');})).join('\n');}
function doExport(kind){var r=R(),nm=(r.f.cardNo||r.id).replace(/[^\w-]+/g,'_');
 if(kind==='copy'){navigator.clipboard.writeText(JSON.stringify(r,null,1)).then(function(){toast(T('Copied','Скопійовано'));},function(){toast(T('Copy blocked','Копіювання заблоковано'));});return;}
 var file=kind==='json'?{filename:'STORM2_UCR_'+nm+'.json',data:JSON.stringify(r,null,1)}:kind==='csv'?{filename:'STORM2_UCR_all_'+today()+'.csv',data:'﻿'+csv()}:{filename:'STORM2_UCR_'+nm+'_summary.txt',data:summary()+'\n\n'+events().map(function(e){return e.t+'  '+(e.role?'R'+e.role+'  ':'')+e.txt;}).join('\n')+((r.voice||[]).length?'\n\nTRANSCRIPT\n'+r.voice.map(function(p){return p.iso+'  R'+p.role+'  '+p.text;}).join('\n'):'')};
 if(!dl){try{var bl=new Blob([file.data],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=file.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast(T('Saved','Збережено'));}catch(e){toast(T('Download unavailable','Завантаження недоступне'));}return;}
 dl.save(file).then(function(){toast(T('Saved','Збережено'));},function(er){if(er&&er.code!=='declined')toast(T('Download unavailable','Завантаження недоступне'));});}

/* ---------- boot ---------- */
try{var sl=localStorage.getItem(KEY+'_lang');if(sl)L=sl;}catch(e){}
load();render();
setInterval(function(){soft();},30000);
setInterval(function(){var c=document.getElementById('vpClock');if(c)c.textContent=hms(nowMs());var rt=document.getElementById('recT');if(rt)rt.textContent=mmss(nowMs()-V.t0);},500);
document.getElementById('content').addEventListener('scroll',spy,{passive:true});
var tries=0;(function boot(){if(!(window.claude&&window.claude.use)){if(tries++<20)setTimeout(boot,250);return;}
 window.claude.use('downloads').then(function(x){dl=x;if(x&&sec==='tl')render();}).catch(function(){});
 window.claude.use('dictation').then(function(x){dict=x;if(x){wireDict();render();}}).catch(function(){});
 window.claude.use('sample').then(function(x){sampleFn=x;if(x)vpRender();}).catch(function(){});
 window.claude.use('db').then(function(x){db=x;if(x)sync();}).catch(function(){});
})();
})();
